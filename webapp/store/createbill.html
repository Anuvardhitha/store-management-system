<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Bill - Store Management</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:'Segoe UI',Arial,sans-serif;
  color:#4b2e24;
  background:
    radial-gradient(circle at 8% 12%,#ffe1c7 0,transparent 24%),
    radial-gradient(circle at 92% 15%,#ffd8d8 0,transparent 24%),
    linear-gradient(135deg,#fffaf3,#ffece5 55%,#fff4ee);
  padding:28px 22px 50px;
}
.page{max-width:1050px;margin:auto;position:relative}
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;margin-bottom:20px;
  background:rgba(255,255,255,.78);border:1px solid #f3d8d0;
  border-radius:22px;box-shadow:0 10px 28px rgba(91,49,34,.08);
}
.brand{font-size:25px;font-weight:800;color:#40251d}
.brand small{display:block;font-size:13px;color:#9b7165;margin-top:3px}
.back{color:#8d3c2c;text-decoration:none;font-weight:700}
.card{
  background:rgba(255,255,255,.94);border-radius:26px;
  padding:28px;box-shadow:0 16px 38px rgba(91,49,34,.10);
  border-top:5px solid #ef6b4e;
}
.title{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.icon{
  width:56px;height:56px;border-radius:18px;background:#ffdcd7;
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
h1{margin:0;font-size:32px;color:#40251d}
.subtitle{margin:4px 0 0;color:#8b6257}
.info{
  padding:14px 17px;background:#fff3ed;border:1px solid #f2d6cc;
  border-radius:15px;margin-bottom:22px;color:#70473b;
}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #efdcd6;border-radius:15px}
th{background:#ffe6e2;color:#6d2b20;padding:13px;text-align:left}
td{padding:11px;border-top:1px solid #f2e6e1}
input{
  width:100%;padding:11px 13px;border:1px solid #e7cec6;
  border-radius:10px;font-size:15px;outline:none;background:#fffaf8;
}
input:focus{border-color:#ef6b4e;box-shadow:0 0 0 3px rgba(239,107,78,.10)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
button,.btn{
  border:0;text-decoration:none;cursor:pointer;padding:12px 20px;
  border-radius:12px;font-weight:800;font-size:15px;
}
button{background:linear-gradient(135deg,#ef6b4e,#f58a68);color:white}
.btn{background:#fff;color:#8b3e2e;border:1px solid #efcfc7}
.decor{position:fixed;right:20px;bottom:20px;font-size:72px;opacity:.16;pointer-events:none}
@media(max-width:700px){.header{gap:12px;align-items:flex-start}.card{padding:18px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="brand">🍫 Store Management<small>Manage Smarter • Bill Faster</small></div>
    <a class="back" href="dashboard.html">← Dashboard</a>
  </header>

  <main class="card">
    <div class="title">
      <div class="icon">🧾</div>
      <div>
        <h1>Create Bill</h1>
        <div class="subtitle">Enter the product IDs and quantities for this sale.</div>
      </div>
    </div>

    <div class="info">
      💡 Enter a valid <strong>Product ID</strong> and the required <strong>Quantity</strong>.
      You can add multiple products to the same bill.
    </div>

    <form action="createbill" method="post">
      <table id="itemsTable">
        <thead>
          <tr><th>Product ID</th><th>Quantity</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="number" name="productId" min="1" required></td>
            <td><input type="number" name="quantity" min="1" required></td>
          </tr>
        </tbody>
      </table>

      <div class="actions">
        <button type="button" onclick="addRow()">＋ Add Another Item</button>
        <button type="submit">🧾 Create Bill</button>
        <a class="btn" href="reports">View Reports</a>
      </div>
    </form>
  </main>
</div>
<div class="decor">🍪 🍫</div>

<script>
function addRow(){
  const tbody=document.querySelector("#itemsTable tbody");
  const row=document.createElement("tr");
  row.innerHTML=
    "<td><input type='number' name='productId' min='1' required></td>"+
    "<td><input type='number' name='quantity' min='1' required></td>";
  tbody.appendChild(row);
}
</script>
</body>
</html>
