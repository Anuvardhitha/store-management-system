<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Product</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;color:#4b2e24;background:linear-gradient(135deg,#fffaf4,#ffe8e2,#f4e9ff);padding:35px 20px}
.container{max-width:600px;margin:auto}.card{background:rgba(255,255,255,.9);border-radius:26px;padding:30px;box-shadow:0 18px 45px rgba(80,45,30,.1);border-top:6px solid #ef6b4e}
h1{margin:0 0 6px;font-size:32px;color:#40251d}p{color:#8e655a}.field{margin-top:16px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #ead7d0;border-radius:12px;font-size:15px;background:#fffaf8}input:focus{outline:none;border-color:#ef6b4e;box-shadow:0 0 0 3px rgba(239,107,78,.12)}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#ef6b4e,#f58a68);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.back{display:block;text-align:center;margin-top:18px;color:#a04b3a;text-decoration:none;font-weight:700}
</style></head><body><div class="container"><div class="card"><h1>🍫 Add Product</h1><p>Add a new item to your store inventory.</p>
<form action="addproduct" method="post">
<div class="field"><label>Product Name</label><input name="name" type="text" required></div>
<div class="field"><label>Price</label><input name="price" type="number" step="0.01" required></div>
<div class="field"><label>Quantity</label><input name="quantity" type="number" min="0" required></div>
<div class="field"><label>Minimum Stock Level</label><input name="minStock" type="number" min="0" required></div>
<button type="submit">Add Product</button></form><a class="back" href="dashboard.html">← Back to Dashboard</a></div></div></body></html>
