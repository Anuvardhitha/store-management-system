<!DOCTYPE html>
<html>
<head>
    <title>Store App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f7f7f8 40%);
            color: #1a1a1a;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 16px;
            color: #111;
        }

        .section {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-left: 4px solid #4f7cff;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .section:nth-of-type(2) {
            border-left-color: #22b573;
        }

        .section:nth-of-type(3) {
            border-left-color: #f5a623;
        }

        .section:nth-of-type(4) {
            border-left-color: #a259ff;
        }

        label,
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            margin-bottom: 16px;
            background-color: #fafafa;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4f7cff;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
        }

        input[type="submit"] {
            width: 100%;
            padding: 11px;
            background-color: #4f7cff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        input[type="submit"]:hover {
            background-color: #3a63e0;
        }

        .section:nth-of-type(3) input[type="submit"] {
            background-color: #f5a623;
        }

        .section:nth-of-type(3) input[type="submit"]:hover {
            background-color: #d98e0f;
        }

        a {
            color: #4f7cff;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid #cddcff;
        }

        a:hover {
            border-bottom-color: #4f7cff;
        }

        p {
            margin: 0;
        }

        .links-section p + p {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="section">
            <h1>Add Product</h1>
            <form action="addproduct" method="post">
                <span class="field-label">Name</span>
                <input type="text" name="name">

                <span class="field-label">Price</span>
                <input type="text" name="price">

                <span class="field-label">Quantity</span>
                <input type="text" name="quantity">

                <span class="field-label">Min Stock Level</span>
                <input type="text" name="minStock">

                <input type="submit" value="Add Product">
            </form>
        </div>

        <div class="section">
            <h1>Create Bill</h1>
            <p><a href="createbill">Go to Billing</a></p>
        </div>

        <div class="section">
            <h1>Restock Product</h1>
            <form action="restock" method="post">
                <span class="field-label">Product ID</span>
                <input type="text" name="productId">

                <span class="field-label">Quantity Received</span>
                <input type="text" name="quantity">

                <input type="submit" value="Restock">
            </form>
        </div>

        <div class="section links-section">
            <h1>Links</h1>
            <p><a href="viewproducts">View All Products</a></p>
            <p><a href="reports">View Reports</a></p>
        </div>

    </div>
</body>
</html>
